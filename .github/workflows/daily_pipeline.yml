name: Automated Daily Market Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests library
        run: pip install requests

      - name: Run Market Ingestion & SQL Analytics
        run: python step2_analytics.py

      - name: Run Automated Data Quality Gates
        run: python step3_quality_check.py
